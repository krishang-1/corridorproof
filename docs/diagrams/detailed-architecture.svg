<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img"><title>Architecture: application, policy and ledger boundaries</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#628778"/></marker></defs><rect width="100%" height="100%" fill="#f4f7f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="65" font-size="34" font-weight="700" fill="#183d33">Architecture: application, policy and ledger boundaries</text><text x="60" y="106" font-size="21" fill="#657b70">Live Drunix test network on one laptop; generated Org1 / Org2 identities; synthetic payments.</text><rect x="60" y="160" width="680" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="192" font-size="23" fill="#246852" font-weight="700">Sender operator / generated Org1 identity</text><text x="80" y="223" font-size="19" fill="#526c60" font-weight="400">Browser role selection is not production authentication</text><rect x="860" y="160" width="680" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="880" y="192" font-size="23" fill="#246852" font-weight="700">Receiver operator / generated Org2 identity</text><text x="880" y="223" font-size="19" fill="#526c60" font-weight="400">Real institutions must control their own credentials</text><polyline points="400,265 400,295 800,295 800,325" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1200,265 1200,295 800,295" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="480" y="330" width="640" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="500" y="362" font-size="23" fill="#246852" font-weight="700">Browser dashboard + Node HTTP API</text><text x="500" y="393" font-size="19" fill="#526c60" font-weight="400">Localhost only; explicitly selected backend</text><polyline points="800,435 800,465 295,465 295,495" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,465 800,495" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,465 1305,465 1305,495" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="500" width="470" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="532" font-size="23" fill="#246852" font-weight="700">Operations read model</text><text x="80" y="563" font-size="19" fill="#526c60" font-weight="400">Lanes, owners, idle age, review flags</text><rect x="565" y="500" width="470" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="585" y="532" font-size="23" fill="#246852" font-weight="700">Synthetic status inbox</text><text x="585" y="563" font-size="19" fill="#526c60" font-weight="400">Reference checks; message ID binding</text><rect x="1070" y="500" width="470" height="115" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="1090" y="532" font-size="23" fill="#246852" font-weight="700">Inspection and comparison</text><text x="1090" y="563" font-size="19" fill="#526c60" font-weight="400">Case dossier + full workspace context</text><text x="1090" y="589" font-size="19" fill="#526c60" font-weight="400">Fresh Org1 / Org2 authenticated reads</text><polyline points="800,605 800,655" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="480" y="660" width="640" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="500" y="692" font-size="23" fill="#246852" font-weight="700">Persist the exact original command</text><text x="500" y="723" font-size="19" fill="#526c60" font-weight="400">Request ID + expected version + payload; explicit replay</text><polyline points="800,765 800,805" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="480" y="810" width="640" height="120" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="500" y="842" font-size="23" fill="#246852" font-weight="700">Go gateway → Go chaincode</text><text x="500" y="873" font-size="19" fill="#526c60" font-weight="400">TLS identity; role/version/idempotency/policy checks</text><text x="500" y="899" font-size="19" fill="#526c60" font-weight="400">Confirm VALID commit; business denial can also be VALID</text><polyline points="800,930 800,965" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><text x="60" y="952" font-size="22" fill="#246852" font-weight="700">JOINT ENDORSEMENT: Org1 AND Org2</text><polyline points="800,965 400,965 400,995" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,965 1200,965 1200,995" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="1000" width="680" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="1032" font-size="23" fill="#246852" font-weight="700">Org1: committing peer / lite peer / validation server</text><text x="80" y="1063" font-size="19" fill="#526c60" font-weight="400">YugabyteDB state store</text><rect x="860" y="1000" width="680" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="880" y="1032" font-size="23" fill="#246852" font-weight="700">Org2: committing peer / lite peer / validation server</text><text x="880" y="1063" font-size="19" fill="#526c60" font-weight="400">YugabyteDB state store</text><text x="60" y="1170" font-size="21" fill="#526c60" font-weight="400">LOCAL STORAGE: inbox metadata and exact submission requests remain adapter bookkeeping.</text><text x="60" y="1210" font-size="21" fill="#526c60" font-weight="400">LEDGER: accepted observations, case state and financial decisions use jointly endorsed writes.</text><text x="60" y="1250" font-size="20" fill="#526c60" font-weight="400">Separate fallback: signed SQLite demo selected explicitly. Live failures never silently switch backend.</text><text x="60" y="1290" font-size="20" fill="#526c60" font-weight="400">Test network also uses a Raft orderer and documented upstream SQL bookmark repairs.</text></g></svg>