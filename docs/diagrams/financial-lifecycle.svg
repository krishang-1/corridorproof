<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img"><title>Financial lifecycle: safe resolution paths</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#628778"/></marker></defs><rect width="100%" height="100%" fill="#f4f7f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="65" font-size="34" font-weight="700" fill="#183d33">Financial lifecycle: safe resolution paths</text><text x="60" y="106" font-size="21" fill="#657b70">Business approvals govern permitted mock execution. Network endorsement governs contract execution.</text><rect x="510" y="160" width="580" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="530" y="192" font-size="23" fill="#246852" font-weight="700">Accepted quote → PAYOUT_PENDING</text><text x="530" y="223" font-size="19" fill="#526c60" font-weight="400">Missing response → RECONCILING; outcome stays unknown</text><polyline points="800,265 800,315 235,315 235,355" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,315 800,355" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,315 1365,315 1365,355" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="360" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="60" y="392" font-size="23" fill="#246852" font-weight="700">Full receiver credit</text><text x="60" y="423" font-size="19" fill="#526c60" font-weight="400">CREDITED</text><rect x="605" y="360" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="625" y="392" font-size="23" fill="#246852" font-weight="700">Partial receiver credit</text><text x="625" y="423" font-size="19" fill="#526c60" font-weight="400">SHORTFALL</text><rect x="1170" y="360" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="1190" y="392" font-size="23" fill="#246852" font-weight="700">Definitive rejection</text><text x="1190" y="423" font-size="19" fill="#526c60" font-weight="400">REFUND_REVIEW</text><polyline points="800,465 800,525" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1365,465 1365,525" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="605" y="530" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="625" y="562" font-size="23" fill="#246852" font-weight="700">Both approve correction</text><text x="625" y="593" font-size="19" fill="#526c60" font-weight="400">CORRECTION_APPROVED</text><rect x="1170" y="530" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="1190" y="562" font-size="23" fill="#246852" font-weight="700">Both approve refund</text><text x="1190" y="593" font-size="19" fill="#526c60" font-weight="400">REFUND_APPROVED</text><polyline points="800,635 800,695" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1365,635 1365,695" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="605" y="700" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="625" y="732" font-size="23" fill="#246852" font-weight="700">Exact synthetic correction</text><text x="625" y="763" font-size="19" fill="#526c60" font-weight="400">Receiver records → CREDITED</text><rect x="1170" y="700" width="390" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="1190" y="732" font-size="23" fill="#246852" font-weight="700">Synthetic refund evidence</text><text x="1190" y="763" font-size="19" fill="#526c60" font-weight="400">Sender records → REFUNDED</text><polyline points="235,465 235,495 550,495 550,835 800,835 800,875" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,805 800,875" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1365,805 1365,835 800,835" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="510" y="880" width="580" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="530" y="912" font-size="23" fill="#246852" font-weight="700">Both closure acknowledgments → CLOSED</text><text x="530" y="943" font-size="19" fill="#526c60" font-weight="400">Keep the commitment and decision history</text><rect x="40" y="570" width="470" height="135" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="60" y="602" font-size="23" fill="#986a2e" font-weight="700">Compliance block → MANUAL_REVIEW</text><text x="60" y="633" font-size="19" fill="#526c60" font-weight="400">No automatic release or refund</text><text x="60" y="659" font-size="19" fill="#526c60" font-weight="400">Review responsibility remains explicit</text><polyline points="510,205 20,205 20,637 35,637" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><text x="60" y="1050" font-size="23" fill="#183d33" font-weight="700">A timeout cannot jump to refund approval. Conflicting evidence requires review.</text><text x="60" y="1095" font-size="20" fill="#526c60" font-weight="400">No rail worker exists: execution evidence and amounts are synthetic. This diagram is the prototype policy.</text></g></svg>