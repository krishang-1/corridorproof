<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>Market context: where CorridorProof fits</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#628778"/></marker></defs><rect width="100%" height="100%" fill="#f4f7f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="65" font-size="34" font-weight="700" fill="#183d33">Market context: where CorridorProof fits</text><text x="60" y="106" font-size="21" fill="#657b70">Existing rails move money. CorridorProof governs case evidence and permitted resolution decisions.</text><text x="60" y="165" font-size="24" fill="#986a2e" font-weight="700">EXISTING ECOSYSTEM</text><rect x="60" y="195" width="470" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="227" font-size="23" fill="#246852" font-weight="700">Sender and receiver PSPs</text><text x="80" y="258" font-size="19" fill="#526c60" font-weight="400">Customers, accounts and payment operations</text><rect x="60" y="365" width="470" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="397" font-size="23" fill="#246852" font-weight="700">Domestic IPS / banks / corridor rails</text><text x="80" y="428" font-size="19" fill="#526c60" font-weight="400">Authoritative money movement and status</text><rect x="60" y="535" width="470" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="80" y="567" font-size="23" fill="#246852" font-weight="700">Service desks / Swift Case Management</text><text x="80" y="598" font-size="19" fill="#526c60" font-weight="400">Existing investigations and orchestration</text><polyline points="295,300 295,360" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="295,470 295,530" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><text x="850" y="165" font-size="24" fill="#246852" font-weight="700">IMPLEMENTED PROTOTYPE</text><rect x="850" y="195" width="690" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="870" y="227" font-size="23" fill="#246852" font-weight="700">Synthetic structured status inbox</text><text x="870" y="258" font-size="19" fill="#526c60" font-weight="400">Bind message, case, quote, code, currency and amount</text><rect x="850" y="365" width="690" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="870" y="397" font-size="23" fill="#246852" font-weight="700">Shared case commitment and evidence</text><text x="870" y="428" font-size="19" fill="#526c60" font-weight="400">Accepted quote; attributable observations; denied decisions</text><rect x="850" y="535" width="690" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="870" y="567" font-size="23" fill="#246852" font-weight="700">Deterministic policy + joint approvals</text><text x="870" y="598" font-size="19" fill="#526c60" font-weight="400">Unknown stays unknown; both parties approve resolution</text><rect x="850" y="705" width="690" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="870" y="737" font-size="23" fill="#246852" font-weight="700">Operations control room + case dossier</text><text x="870" y="768" font-size="19" fill="#526c60" font-weight="400">Next owner, missing votes, review age and ledger comparison</text><polyline points="1195,300 1195,360" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1195,470 1195,530" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="1195,640 1195,700" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="530,418 815,418 815,247 845,247" fill="none" stroke="#628778" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="555" y="365" font-size="18" fill="#526c60" font-weight="400">Future authenticated</text><text x="555" y="392" font-size="18" fill="#526c60" font-weight="400">rail connector</text><polyline points="530,588 845,588" fill="none" stroke="#628778" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="555" y="554" font-size="18" fill="#526c60" font-weight="400">Partner integration</text><text x="60" y="900" font-size="22" fill="#526c60" font-weight="400">Dashed external connections are planned integrations. No real bank messages or funds are connected.</text><text x="60" y="944" font-size="22" fill="#526c60" font-weight="400">Market wedge to validate: corridor partners needing jointly governed records and approvals.</text><text x="60" y="986" font-size="20" fill="#526c60" font-weight="400">Existing competitors already automate investigations. Partner demand and savings remain unvalidated.</text></g></svg>