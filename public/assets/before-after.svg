<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc"><title id="title">Before and after: corridor exception coordination</title><desc id="desc">An illustrative manual partner workflow compared with the implemented CorridorProof prototype. This is not a claim about all providers or competitor limitations.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#628778"/></marker></defs><rect width="1600" height="970" fill="#f4f7f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="70" font-size="34" font-weight="700" fill="#183d33">Cross-border exceptions: how the coordination changes</text><text x="70" y="112" font-size="21" fill="#657b70">Illustrative target workflow. Actual partner baseline must be established in a shadow pilot.</text><text x="80" y="180" font-size="27" font-weight="700" fill="#986a2e">BEFORE · Separate operational records</text><text x="860" y="180" font-size="27" font-weight="700" fill="#246852">AFTER · Shared resolution workspace</text><rect x="70" y="210" width="680" height="95" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="94" y="246" fill="#986a2e" font-size="25" font-weight="700">Separate status records</text><text x="94" y="280" fill="#526c60" font-size="20">Sender and receiver maintain their own view</text><path d="M410,308 V334" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="340" width="680" height="95" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="94" y="376" fill="#986a2e" font-size="25" font-weight="700">Request payout evidence</text><text x="94" y="410" fill="#526c60" font-size="20">Ask the counterparty what happened</text><path d="M410,438 V464" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="470" width="680" height="95" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="94" y="506" fill="#986a2e" font-size="25" font-weight="700">Reconstruct the case</text><text x="94" y="540" fill="#526c60" font-size="20">Match references, amounts and observed outcome</text><path d="M410,568 V594" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="600" width="680" height="95" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="94" y="636" fill="#986a2e" font-size="25" font-weight="700">Coordinate approvals</text><text x="94" y="670" fill="#526c60" font-size="20">Collect agreement through existing channels</text><path d="M410,698 V724" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="730" width="680" height="95" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="94" y="766" fill="#986a2e" font-size="25" font-weight="700">Assemble closure evidence</text><text x="94" y="800" fill="#526c60" font-size="20">Bring the decision and supporting records together</text><rect x="850" y="210" width="680" height="95" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="874" y="246" fill="#246852" font-size="25" font-weight="700">Immutable accepted quote</text><text x="874" y="280" fill="#526c60" font-size="20">One recorded recipient commitment</text><path d="M1190,308 V334" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="340" width="680" height="95" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="874" y="376" fill="#246852" font-size="25" font-weight="700">Structured report intake</text><text x="874" y="410" fill="#526c60" font-size="20">Bind message ID, case, quote and status</text><path d="M1190,438 V464" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="470" width="680" height="95" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="874" y="506" fill="#246852" font-size="25" font-weight="700">Deterministic action policy</text><text x="874" y="540" fill="#526c60" font-size="20">Unknown reconciles; blocked stays in review</text><path d="M1190,568 V594" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="600" width="680" height="95" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="874" y="636" fill="#246852" font-size="25" font-weight="700">Joint resolution approvals</text><text x="874" y="670" fill="#526c60" font-size="20">Contract requires both parties before execution</text><path d="M1190,698 V724" stroke="#628778" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="730" width="680" height="95" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="874" y="766" fill="#246852" font-size="25" font-weight="700">Acknowledged closure + case dossier</text><text x="874" y="800" fill="#526c60" font-size="20">Retain accepted evidence and denied decisions</text><text x="70" y="910" font-size="20" fill="#657b70">This baseline is a partner-validation hypothesis.</text><text x="850" y="910" font-size="20" fill="#657b70">Implemented: local Drunix, synthetic payment reports.</text><text x="70" y="947" font-size="18" fill="#657b70">Neither layout claims that Swift or Nexus lacks automation. CorridorProof does not move funds or prove bank evidence true.</text></g></svg>