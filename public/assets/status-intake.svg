<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>Status intake: observation, preview, commit and replay</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#628778"/></marker></defs><rect width="100%" height="100%" fill="#f4f7f3"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="65" font-size="34" font-weight="700" fill="#183d33">Status intake: observation, preview, commit and replay</text><text x="60" y="106" font-size="21" fill="#657b70">A synthetic JSON adapter rehearses status semantics. It is not a bank connector or ISO 20022 XML implementation.</text><rect x="440" y="160" width="720" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="460" y="192" font-size="23" fill="#246852" font-weight="700">1 · Receive and bind the report</text><text x="460" y="223" font-size="19" fill="#526c60" font-weight="400">Message ID, accepted case/quote, INR amount and status</text><polyline points="800,265 800,305" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="440" y="310" width="720" height="105" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="460" y="342" font-size="23" fill="#246852" font-weight="700">2 · Validate and preview existing policy</text><text x="460" y="373" font-size="19" fill="#526c60" font-weight="400">ACCC / RJCT / BLCK / PDNG / ACWP; no mutation in preview</text><polyline points="800,415 800,445 400,445 400,480" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><polyline points="800,445 1200,445 1200,480" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="485" width="680" height="120" rx="10" fill="white" stroke="#986a2e" stroke-width="2"/><text x="80" y="517" font-size="23" fill="#986a2e" font-weight="700">3a · Hold uncertainty or contradictions</text><text x="80" y="548" font-size="19" fill="#526c60" font-weight="400">Pending, unposted, over-credit or conflicting report</text><text x="80" y="574" font-size="19" fill="#526c60" font-weight="400">Retain local disposition; no automatic case mutation</text><rect x="860" y="485" width="680" height="120" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="880" y="517" font-size="23" fill="#246852" font-weight="700">3b · Receiver explicitly records ready evidence</text><text x="880" y="548" font-size="19" fill="#526c60" font-weight="400">Persist exact request identity before gateway submission</text><text x="880" y="574" font-size="19" fill="#526c60" font-weight="400">Existing chaincode checks still determine permission</text><polyline points="1200,605 1200,645" fill="none" stroke="#628778" stroke-width="2.5" marker-end="url(#a)"/><rect x="860" y="650" width="680" height="120" rx="10" fill="white" stroke="#246852" stroke-width="2"/><text x="880" y="682" font-size="23" fill="#246852" font-weight="700">4 · Confirm the result</text><text x="880" y="713" font-size="19" fill="#526c60" font-weight="400">VALID receipt → record accepted observation</text><text x="880" y="739" font-size="19" fill="#526c60" font-weight="400">Uncertain result → reconcile the original request</text><text x="60" y="690" font-size="24" fill="#246852" font-weight="700">REPLAY SAFEGUARDS</text><text x="60" y="738" font-size="21" fill="#526c60" font-weight="400">Same ID + same contents → original result / exact replay</text><text x="60" y="781" font-size="21" fill="#526c60" font-weight="400">Same ID + changed contents → reject</text><text x="60" y="824" font-size="21" fill="#526c60" font-weight="400">Concurrent reuse → cannot replace the saved command</text><text x="60" y="921" font-size="22" fill="#526c60" font-weight="400">Only accepted observations are ledger events. Held inbox entries remain local bookkeeping.</text><text x="60" y="966" font-size="20" fill="#526c60" font-weight="400">Status reports establish simulated observations, not external truth or permission to move real money.</text></g></svg>